format_version = 7
id = "medievil.enhancement.widescreen"
version = "1.0.0"
name = "MediEvil Adaptive View"
author = "MediEvil Recompiled"
license = "GPL-3.0-only"
description = "Adaptive rendering, extended terrain distance and configurable subdivision."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94227"
disc_sha256 = "d522a86c154524d634a0d9b84b2048b41cafe83013a87f2fa31a2c117aabce82"

[[feature]]
id = "widescreen"
name = "Adaptive View"
description = "Render additional world geometry to fit the window. Menus and movies retain their original proportions."
group = "Display"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "View"
type = "choice"
default = "Fit"

[[option.choice]]
value = "Fit"
label = "Fit to Window"

[[option.choice]]
value = "4:3"
label = "4:3"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "medievil.widescreen"

[[option]]
feature = "widescreen"
id = "draw_distance"
label = "Draw distance"
type = "choice"
default = "3x"

[[option.choice]]
value = "1x"
label = "Original"

[[option.choice]]
value = "2x"
label = "Extended (2x)"

[[option.choice]]
value = "3x"
label = "Extended (3x)"

[[option]]
feature = "widescreen"
id = "subdivision_bypass"
label = "Bypass terrain subdivision"
type = "boolean"
default = "true"

